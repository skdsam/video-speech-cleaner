[package]
name = "speech-cleaner-app"
version = "0.1.0"
description = "Speech Cleaner - Remove filler words from video audio offline"
authors = ["SkdSam"]
edition = "2021"

[lib]
name = "speech_cleaner_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rodio = "0.19"
hound = "3.5"
